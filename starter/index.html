
<!DOCTYPE html>
<html>
<head>
    <title>Styled Table</title>

    <style>
        body {
            font-family: Arial;
            background-color: lightyellow;
            text-align: center;
        }

        h1 {
            color: darkblue;
        }

        table {
            width: 70%;
            margin: auto;
            border-collapse: collapse;
            background-color: white;
        }

        th {
            background-color: blue;
            color: white;
            padding: 12px;
        }

        td {
            border: 1px solid black;
            padding: 10px;
        }

        tr:hover {
            background-color: lightblue;
        }
    </style>
</head>

<body>

    <h1>Student Details</h1>

    <table>
        <tr>
            <th>Roll No</th>
            <th>Name</th>
            <th>Department</th>
            <th>Mark</th>
        </tr>

        <tr>
            <td>1</td>
            <td>Arun</td>
            <td>BCA</td>
            <td>85</td>
        </tr>

        <tr>
            <td>2</td>
            <td>Ravi</td>
            <td>B.Sc</td>
            <td>90</td>
        </tr>

        <tr>
            <td>3</td>
            <td>Kumar</td>
            <td>B.Com</td>
            <td>88</td>
        </tr>
    </table>

</body>
</html>
